<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16162a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Un RPG diario hecho a mano para Kath.">
<title>Rutina Legendaria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
/* ==========================================================================
   RUTINA LEGENDARIA — estilos
   ========================================================================== */
:root{
  --crema:#fdf6ec;
  --crema2:#f2e6d4;
  --tinta:#3a2f2a;
  --rosa:#f06292;
  --rosa-osc:#c2185b;
  --oro:#f7c948;
  --verde:#7ed957;
  --noche:#16162a;
  --noche2:#242440;
  --borde:#2b2b45;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:#0d0d18;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--tinta);
  display:flex;justify-content:center;align-items:stretch;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}

#app{
  position:relative;
  width:100%;max-width:520px;
  height:100dvh;max-height:100dvh;
  display:flex;flex-direction:column;
  background:var(--noche);
  overflow:hidden;
}
@supports not (height:100dvh){ #app{height:100vh} }

/* ---------- HUD ---------- */
#hud{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:linear-gradient(180deg,var(--noche2),var(--noche));
  border-bottom:2px solid #000;
  color:#fff;font-size:12px;flex:none;
}
.hudBloque{display:flex;flex-direction:column;gap:3px;min-width:0}
.hudFila{display:flex;align-items:center;gap:6px;white-space:nowrap}
.insignia{
  background:var(--rosa);color:#fff;font-weight:800;
  padding:2px 8px;border-radius:999px;font-size:11px;
  box-shadow:0 2px 0 var(--rosa-osc);
}
.barra{height:7px;border-radius:99px;background:#0c0c16;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.barra>div{height:100%;border-radius:99px;transition:width .35s ease}
#hudXP{background:linear-gradient(90deg,#63d0ff,#3aa0e8)}
#hudDiaBarra{background:linear-gradient(90deg,#ffd76e,var(--oro))}
.hudChip{display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px}
.hudMini{font-size:10px;opacity:.65;letter-spacing:.4px}
#btnMenu{
  margin-left:auto;flex:none;
  background:var(--noche2);color:#fff;border:2px solid #000;
  border-radius:10px;padding:7px 11px;font-size:16px;line-height:1;
  box-shadow:0 2px 0 #000;
}
#btnMenu:active{transform:translateY(2px);box-shadow:none}

/* ---------- escena ---------- */
#escena{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#1b1b2a}
#lienzo{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

#efectos{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flotante{
  position:absolute;left:50%;top:46%;transform:translateX(-50%);
  color:#fff;font-weight:900;font-size:19px;
  text-shadow:0 2px 0 #000,0 0 12px rgba(255,215,110,.8);
  animation:subir 1.4s ease-out forwards;white-space:nowrap;
}
@keyframes subir{
  0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
  20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-60px) scale(1)}
}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#flash.activo{animation:destello .5s ease-out}
@keyframes destello{0%{opacity:.85}100%{opacity:0}}

/* ---------- diálogo ---------- */
#dialogo{
  position:absolute;left:8px;right:8px;bottom:8px;
  background:var(--crema);
  border:3px solid #1d1d2e;border-radius:14px;
  box-shadow:0 0 0 3px var(--crema2) inset, 0 8px 20px rgba(0,0,0,.45);
  padding:14px 16px 16px;
  transform:translateY(130%);opacity:0;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.2),opacity .18s;
  z-index:6;
}
#dialogo.visible{transform:translateY(0);opacity:1}
#dialogo.carta{background:#fff3f7;box-shadow:0 0 0 3px #ffd8e6 inset,0 8px 20px rgba(0,0,0,.45)}
#dialogo.fanfarria{background:#fffaf0;box-shadow:0 0 0 3px #ffe6a8 inset,0 0 26px rgba(247,201,72,.5)}
#dlgTexto{font-size:15.5px;line-height:1.5;white-space:pre-wrap;font-weight:600;min-height:2.9em}
#dlgPremio{
  margin-top:8px;display:none;font-weight:900;color:var(--rosa-osc);
  font-size:14px;letter-spacing:.3px;
}
#dlgFlecha{
  position:absolute;right:14px;bottom:9px;width:0;height:0;opacity:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:9px solid var(--rosa);
}
#dlgFlecha.visible{opacity:1;animation:latir .7s infinite}
@keyframes latir{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
#dlgOpciones{display:none;gap:8px;margin-top:12px;flex-direction:column}
#dlgOpciones.visible{display:flex}
.opcion{
  position:relative;font:inherit;font-weight:800;font-size:15px;
  background:#fff;border:3px solid #1d1d2e;border-radius:11px;
  padding:11px 14px 11px 40px;text-align:left;color:var(--tinta);
  box-shadow:0 3px 0 #1d1d2e;transition:background .12s,transform .08s;
}
.opcion:active{transform:translateY(3px);box-shadow:none}
.opcion .numOp{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:6px;
  background:var(--crema2);color:#9a8b7e;
  font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
}
.opcion.sel{background:#ffe9f1;border-color:var(--rosa-osc)}
.opcion.sel .numOp{background:var(--rosa);color:#fff}
/* en el celular no hace falta marcar la opción "elegida" con el teclado */
@media (hover:none){ .opcion{padding-left:14px} .opcion .numOp{display:none} .opcion.sel{background:#fff;border-color:#1d1d2e} }

/* ---------- controles ---------- */
#controles{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(180deg,var(--noche),#101020);
  border-top:2px solid #000;
}
#dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px}
.dbtn{
  background:linear-gradient(180deg,#3b3b5c,#2a2a44);
  border:2px solid #000;color:#cfd3e6;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;border-radius:8px;box-shadow:0 3px 0 #000;
}
.dbtn.presionado{background:var(--rosa);color:#fff;transform:translateY(3px);box-shadow:none}
#darriba{grid-area:1/2}#dizq{grid-area:2/1}#dder{grid-area:2/3}#dabajo{grid-area:3/2}
#dcentro{grid-area:2/2;background:#22223a;border:2px solid #000;border-radius:8px}

#botones{display:flex;align-items:center;gap:14px}
.bbtn{
  width:62px;height:62px;border-radius:50%;
  border:3px solid #000;font-weight:900;font-size:20px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #000;
}
#botA{background:linear-gradient(180deg,#ff7fa8,#e0416f)}
#botB{background:linear-gradient(180deg,#7f9cff,#4159c9);width:52px;height:52px;font-size:17px}
.bbtn:active,.bbtn.presionado{transform:translateY(4px);box-shadow:none;filter:brightness(1.15)}
.bbtn .tecla{display:none}

/* ---------- ayuda de teclado (sólo en compu) ---------- */
#ayudaTeclas{
  display:none;flex-wrap:wrap;justify-content:center;gap:6px 16px;
  padding:9px 14px calc(env(safe-area-inset-bottom) + 9px);
  background:#0c0c16;border-top:1px solid #23233a;
  color:#8b90ad;font-size:11.5px;letter-spacing:.2px;
}
#ayudaTeclas b{
  color:#e8eaf6;background:#22223a;border:1px solid #34345a;border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;margin:0 1px;font-size:11px;
}
@media (hover:hover) and (pointer:fine){
  #ayudaTeclas{display:flex}
  .bbtn{position:relative}
  .bbtn .tecla{
    display:block;position:absolute;bottom:-7px;font-style:normal;
    font-size:9.5px;font-weight:800;letter-spacing:.5px;
    background:#0c0c16;color:#aab0cc;border:1px solid #34345a;
    border-radius:4px;padding:0 5px;
  }
}

/* ---------- título ---------- */
#titulo{
  position:absolute;inset:0;z-index:20;
  background:linear-gradient(160deg,#2b1b3d,#16162a 55%,#0f2233);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:#fff;text-align:center;padding:24px;
  transition:opacity .45s;
}
#titulo.oculto{opacity:0;pointer-events:none}
#tituloChico{font-size:13px;letter-spacing:5px;text-transform:uppercase;opacity:.75}
#tituloGrande{
  font-size:38px;font-weight:900;line-height:1.05;
  background:linear-gradient(180deg,#fff,#ffd0e0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 0 rgba(0,0,0,.35);
}
#tituloNombre{font-size:17px;font-weight:800;color:var(--oro)}
#tituloPie{font-size:12px;opacity:.7;margin-top:2px}
#tituloTocar{
  margin-top:18px;background:var(--rosa);color:#fff;font-weight:900;
  border:3px solid #000;border-radius:14px;padding:14px 28px;font-size:17px;
  box-shadow:0 4px 0 #000;animation:respirar 1.8s infinite;
}
@keyframes respirar{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#corazones{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.5}
#corazones i{position:absolute;font-style:normal;font-size:18px;animation:flotar linear infinite}
@keyframes flotar{from{transform:translateY(110%) rotate(0)}to{transform:translateY(-120%) rotate(360deg)}}

#cargando{
  position:absolute;inset:0;z-index:30;background:#0d0d18;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:2px;
}

/* ---------- menú ---------- */
#menu{
  position:absolute;inset:0;z-index:25;background:rgba(10,10,20,.55);
  display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#menu.visible{opacity:1;pointer-events:auto}
#menuCaja{
  background:var(--crema);border-top:4px solid #1d1d2e;
  border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.9,.3,1.05);
}
#menu.visible #menuCaja{transform:translateY(0)}
#menuBarra{
  display:flex;align-items:center;gap:6px;padding:10px 10px 0;
  border-bottom:2px solid var(--crema2);
}
.tab{
  flex:1;font:inherit;font-weight:800;font-size:11.5px;
  background:none;border:none;color:#9a8b7e;padding:10px 2px;border-radius:10px 10px 0 0;
  white-space:nowrap;
}
.tab.activa{background:var(--crema2);color:var(--rosa-osc)}
#btnCerrarMenu{
  flex:none;background:none;border:none;font-size:20px;color:#9a8b7e;padding:6px 8px;
}
#menuCuerpo{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}

.panel{background:#fff;border:2px solid var(--crema2);border-radius:14px;padding:13px;margin-bottom:12px}
.panel.centro{text-align:center}
.panelTitulo{font-weight:900;font-size:15px;margin-bottom:7px;color:var(--rosa-osc)}
.sub{font-size:12.5px;color:#7c6f66;line-height:1.5;margin-top:4px}
.barraGrande{height:12px;background:var(--crema2);border-radius:99px;overflow:hidden}
.barraGrande>div{height:100%;background:linear-gradient(90deg,#ffd76e,var(--oro));transition:width .4s}

.lista{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.item{
  display:flex;align-items:center;gap:11px;background:#fff;
  border:2px solid var(--crema2);border-radius:13px;padding:11px 12px;
}
.item.ok{background:#f2fbf0;border-color:#cfe9c6}
.item.caro{opacity:.55}
.item .ico{font-size:22px;width:28px;text-align:center;flex:none}
.item .txt{flex:1;min-width:0;font-size:14px}
.item .txt b{display:block;font-weight:800}
.item .txt small{display:block;font-size:11.5px;color:#8a7d73;margin-top:2px;line-height:1.35}
.item .der{font-weight:900;color:var(--rosa-osc);font-size:13px;flex:none}
.item.ok .der{color:#4a9a3a}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:11px;height:11px;border-radius:50%;background:var(--crema2);border:1.5px solid #ddd0be}
.pips i.on{background:var(--verde);border-color:#5db347}

.btnCanje{
  font:inherit;font-weight:900;font-size:12.5px;flex:none;
  background:var(--oro);border:2px solid #1d1d2e;border-radius:10px;
  padding:9px 11px;box-shadow:0 3px 0 #1d1d2e;color:#3a2f2a;
}
.btnCanje:disabled{background:#e6e0d6;box-shadow:0 3px 0 #c9c1b4;color:#a99f93}
.btnCanje:active:not(:disabled){transform:translateY(3px);box-shadow:none}

.hist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.histDia{
  display:flex;justify-content:space-between;font-size:12.5px;
  padding:7px 9px;background:var(--crema);border-radius:9px;font-weight:600;
}
.fila{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:6px 0}
.inp{
  width:100%;font:inherit;font-size:14px;padding:10px 12px;margin-top:10px;
  border:2px solid var(--crema2);border-radius:10px;background:var(--crema);
}
.btnPrim{
  width:100%;font:inherit;font-weight:900;margin-top:9px;
  background:var(--rosa);color:#fff;border:2px solid #1d1d2e;border-radius:11px;
  padding:11px;box-shadow:0 3px 0 #1d1d2e;
}
.btnPeligro{
  width:100%;font:inherit;font-weight:800;margin-top:10px;
  background:#fff;color:#c23b3b;border:2px solid #e8b4b4;border-radius:11px;padding:11px;
}
/* ---------- panel de progreso ---------- */
.heroNum{
  font-size:52px;font-weight:900;line-height:1;color:var(--rosa-osc);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.heroNum small{font-size:26px}
.heroTxt{font-weight:800;font-size:14px;color:#7c6f66;margin-top:2px}

.tira{
  display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:10px;
  padding:0 2px 0;border-bottom:2px solid var(--crema2);
}
.colDia{
  flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:stretch;gap:2px;min-width:0;
}
.colDia .valDia{
  font-size:9.5px;font-weight:900;color:#8a7d73;text-align:center;height:12px;line-height:12px;
}
.barDia{border-radius:4px 4px 0 0;min-height:4px;transition:height .4s ease}
.colDia.hoy .barDia{box-shadow:0 0 0 2px var(--rosa-osc)}
.colDia.hoy .valDia{color:var(--rosa-osc)}
.tiraPie{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:10.5px;color:#9a8b7e;margin-top:6px;
}
.escala{display:flex;align-items:center;gap:3px}
.escala i{width:11px;height:11px;border-radius:3px;display:inline-block}

.cuadricula{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.celda{
  background:var(--crema);border-radius:11px;padding:10px 6px;text-align:center;
}
.celda b{display:block;font-size:17px;font-weight:900;color:var(--rosa-osc)}
.celda span{display:block;font-size:10.5px;color:#8a7d73;margin-top:3px;line-height:1.25}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipAnimo{
  background:var(--crema);border-radius:99px;padding:6px 11px;
  font-size:12px;font-weight:600;color:#7c6f66;
}
.chipAnimo b{color:var(--rosa-osc)}

.bichoGrande{font-size:54px}
.bichoLienzo{image-rendering:pixelated;width:96px;height:96px}

/* pantallas anchas: el juego se ve más grande al costado */
@media (min-width:900px) and (min-height:700px){
  body{align-items:center}
  #app{height:min(96dvh,900px);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);border:1px solid #23233a}
}

</style>
</head>
<body>
<div id="app">

  <!-- ============ HUD ============ -->
  <header id="hud">
    <div class="hudBloque">
      <div class="hudFila">
        <span class="insignia">Nv <span id="hudNivel">1</span></span>
        <span class="hudMini" id="hudXPTxt">0/80</span>
      </div>
      <div class="barra" style="width:96px"><div id="hudXP" style="width:0%"></div></div>
    </div>
    <div class="hudBloque">
      <div class="hudFila"><span class="hudMini">HOY</span><span class="hudChip" id="hudDia">0/0</span></div>
      <div class="barra" style="width:80px"><div id="hudDiaBarra" style="width:0%"></div></div>
    </div>
    <div class="hudBloque">
      <div class="hudFila"><span class="hudChip">🪙 <span id="hudOro">0</span></span></div>
      <div class="hudFila"><span class="hudChip">🔥 <span id="hudRacha">0</span></span></div>
    </div>
    <button id="btnMenu" aria-label="Menú">☰</button>
  </header>

  <!-- ============ ESCENA ============ -->
  <main id="escena">
    <canvas id="lienzo"></canvas>
    <div id="efectos"></div>
    <div id="flash"></div>

    <section id="dialogo">
      <div id="dlgTexto"></div>
      <div id="dlgPremio"></div>
      <div id="dlgOpciones"></div>
      <div id="dlgFlecha"></div>
    </section>

    <section id="titulo">
      <div id="corazones"></div>
      <div id="tituloChico">rutina</div>
      <div id="tituloGrande">LEGENDARIA</div>
      <div id="tituloNombre">Kath</div>
      <div id="tituloPie"></div>
      <button id="tituloTocar">▶  Empezar</button>
    </section>

    <div id="cargando">CARGANDO…</div>
  </main>

  <!-- ============ CONTROLES ============ -->
  <footer id="controles">
    <div id="dpad">
      <div class="dbtn" id="darriba">▲</div>
      <div class="dbtn" id="dizq">◀</div>
      <div id="dcentro"></div>
      <div class="dbtn" id="dder">▶</div>
      <div class="dbtn" id="dabajo">▼</div>
    </div>
    <div id="botones">
      <div class="bbtn" id="botB">B<i class="tecla">X</i></div>
      <div class="bbtn" id="botA">A<i class="tecla">Z</i></div>
    </div>
  </footer>

  <div id="ayudaTeclas">
    <span><b>← ↑ ↓ →</b> o <b>WASD</b> moverte</span>
    <span><b>Z</b> o <b>Espacio</b> aceptar</span>
    <span><b>X</b> o <b>Esc</b> volver</span>
    <span><b>M</b> menú</span>
  </div>

  <!-- ============ MENÚ ============ -->
  <section id="menu">
    <div id="menuCaja">
      <nav id="menuBarra">
        <button class="tab activa" data-p="misiones">Hoy</button>
        <button class="tab" data-p="progreso">Progreso</button>
        <button class="tab" data-p="premios">Premios</button>
        <button class="tab" data-p="compa">Compa</button>
        <button class="tab" data-p="ajustes">Ajustes</button>
        <button id="btnCerrarMenu" aria-label="Cerrar">✕</button>
      </nav>
      <div id="menuCuerpo"></div>
    </div>
  </section>

</div>

<script>
/* ============================================================================
 *  RUTINA LEGENDARIA — Datos y configuración
 *  ---------------------------------------------------------------------------
 *  TODO lo que probablemente quieras cambiar (nombres, mensajes, misiones,
 *  premios) está en este bloque. No hace falta tocar el resto del código.
 * ==========================================================================*/

const CONFIG = {
  jugadora: 'Kath',
  autor: 'Diego',
  // Cuántas misiones hay que completar en el día para mantener la racha
  misionesParaRacha: 5,
  // La "hora de reinicio": a las 4 AM arranca el día nuevo (así trasnochar no rompe la racha)
  horaReinicio: 4,
  version: '1.0.0'
};

/* ---------------------------------------------------------------------------
 *  MISIONES DIARIAS
 *  id      : identificador interno (no repetir)
 *  nombre  : lo que se ve en la lista

/* ============================================================================
 *  ARTE — todo el pixel art se dibuja por código (rectángulos de 1 px)
 *  Fuente en grilla de 16 px por tile; se escala x3 => 48 px reales.
 * ==========================================================================*/

const TILE_SRC = 16;      // px de la grilla fuente
const S = 3;              // escala
const TILE = TILE_SRC * S; // 48 px en pantalla

/* --- utilidades de dibujo ------------------------------------------------ */
function lienzo(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g };
}

function pintar(w, h, rects) {
  const { c, g } = lienzo(w, h);
  for (const r of rects) {
    if (!r) continue;
    g.fillStyle = r[4];
    g.fillRect(r[0], r[1], r[2], r[3]);
  }
  return c;
}

/* círculo relleno hecho con filas de píxeles */
function circ(cx, cy, rad, color) {
  const out = [];
  for (let y = -rad; y <= rad; y++) {
    const dx = Math.floor(Math.sqrt(Math.max(0, rad * rad - y * y)));
    if (dx <= 0) continue;
    out.push([cx - dx, cy + y, dx * 2, 1, color]);
  }
  return out;
}

/* óvalo relleno */
function oval(cx, cy, rx, ry, color) {
  const out = [];
  for (let y = -ry; y <= ry; y++) {
    const dx = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    if (dx <= 0) continue;
    out.push([cx - dx, cy + y, dx * 2, 1, color]);
  }
  return out;
}

/* ruido determinístico para variar los tiles sin que se note el patrón */
function rnd(seed) {
  let x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

/* ============================================================================
 *  TILES DEL SUELO  (3 variantes por tipo para que no se vea repetido)
 * ==========================================================================*/
const TILES = {};

function construirTiles() {
  const T = TILE_SRC;

  // --- pasto ---
  TILES.G = [];
  for (let v = 0; v < 3; v++) {
    const r = [[0, 0, T, T, '#63b04f']];
    for (let i = 0; i < 26; i++) {
      const s = v * 100 + i;
      const x = Math.floor(rnd(s) * T), y = Math.floor(rnd(s + 7) * T);
      r.push([x, y, 1, 1, rnd(s + 3) > 0.5 ? '#79c25f' : '#55a044']);
    }
    // matitas
    for (let i = 0; i < 3; i++) {
      const s = v * 50 + i * 11;
      const x = 2 + Math.floor(rnd(s) * (T - 5)), y = 3 + Math.floor(rnd(s + 2) * (T - 7));
      r.push([x, y + 1, 1, 2, '#3f8a38'], [x + 1, y, 1, 3, '#4b9a40'], [x + 2, y + 1, 1, 2, '#3f8a38']);
    }
    TILES.G.push(pintar(T, T, r));
  }

  // --- alfombra del dormitorio (lila suave: hace resaltar el rojo del vestido) ---
  TILES[','] = [pintar(T, T, [
    [0, 0, T, T, '#ded3ee'],
    [0, 0, T, 1, '#cdc0e2'], [0, 0, 1, T, '#cdc0e2'],
    [2, 2, 2, 2, '#eae2f6'], [10, 6, 2, 2, '#eae2f6'], [6, 11, 2, 2, '#eae2f6'],
    [12, 12, 1, 1, '#c5b6dd'], [4, 7, 1, 1, '#c5b6dd']
  ])];

  // --- baldosa del baño ---
  TILES.T = [pintar(T, T, [
    [0, 0, T, T, '#dff0f6'],
    [0, 0, T, 1, '#c2dfe9'], [0, 0, 1, T, '#c2dfe9'],
    [8, 0, 1, T, '#cfe6ef'], [0, 8, T, 1, '#cfe6ef'],
    [3, 3, 1, 1, '#eef8fb'], [11, 11, 1, 1, '#eef8fb']
  ])];

  // --- piso de cocina (damero suave) ---
  TILES.K = [pintar(T, T, [
    [0, 0, T, T, '#f2e7d1'],
    [0, 0, 8, 8, '#e3d3b4'], [8, 8, 8, 8, '#e3d3b4'],
    [0, 0, T, 1, '#d9c8a8'], [0, 0, 1, T, '#d9c8a8']
  ])];

  // --- piso de madera ---
  TILES['.'] = [];
  for (let v = 0; v < 2; v++) {
    const r = [[0, 0, T, T, '#cfa471']];
    const off = v * 8;
    r.push([0, 0, T, 1, '#b98e5f'], [0, 8, T, 1, '#b98e5f']);
    r.push([off, 0, 1, 8, '#b98e5f'], [(off + 8) % 16, 8, 1, 8, '#b98e5f']);
    r.push([2, 3, 6, 1, '#d9b184'], [9, 11, 5, 1, '#d9b184']);
    TILES['.'].push(pintar(T, T, r));
  }

  // --- puerta / umbral ---
  TILES.D = [pintar(T, T, [
    [0, 0, T, T, '#cfa471'],
    [0, 0, T, 2, '#8b5e3c'], [0, T - 2, T, 2, '#8b5e3c'],
    [3, 5, 10, 6, '#b98e5f']
  ])];

  // --- sendero de piedra ---
  TILES.P = [pintar(T, T, [
    [0, 0, T, T, '#cfc6b4'],
    [1, 1, 6, 6, '#ded5c3'], [9, 1, 6, 6, '#d6ccba'],
    [1, 9, 6, 6, '#d6ccba'], [9, 9, 6, 6, '#ded5c3'],
    [0, 0, T, 1, '#b9af9c']
  ])];

  // --- agua (2 frames animados) ---
  TILES['~'] = [];
  for (let v = 0; v < 2; v++) {
    const r = [[0, 0, T, T, '#4aa8d8'], [0, 0, T, 6, '#54b4e2']];
    const o = v * 5;
    r.push([(2 + o) % 14, 4, 4, 1, '#a5dcf2'], [(9 + o) % 14, 10, 3, 1, '#a5dcf2']);
    r.push([(6 + o) % 14, 12, 4, 1, '#3d97c6']);
    TILES['~'].push(pintar(T, T, r));
  }

  // --- pared interior: [0] remate de arriba, [1] cuerpo (cuando sigue habiendo pared encima) ---
  TILES['#'] = [
    pintar(T, T, [
      [0, 0, T, T, '#8a6a4f'],
      [0, 0, T, 4, '#a37f5f'],
      [0, 0, T, 1, '#b58e6b'],
      [0, T - 2, T, 2, '#6f5540'],
      [0, 6, T, 1, '#7d6048'], [8, 7, 1, 9, '#7d6048'], [0, 11, T, 1, '#7d6048']
    ]),
    pintar(T, T, [
      [0, 0, T, T, '#8a6a4f'],
      [0, T - 2, T, 2, '#6f5540'],
      [0, 3, T, 1, '#7d6048'], [4, 4, 1, 6, '#7d6048'],
      [0, 10, T, 1, '#7d6048'], [11, 11, 1, 5, '#7d6048'],
      [2, 6, 3, 1, '#96755a'], [9, 13, 4, 1, '#96755a']
    ])
  ];

  // --- cerco del terreno ---
  TILES.F = [pintar(T, T, [
    [0, 0, T, T, '#63b04f'],
    [0, 5, T, 3, '#a9713f'], [0, 10, T, 3, '#a9713f'],
    [0, 5, T, 1, '#c08a55'], [0, 10, T, 1, '#c08a55'],
    [3, 2, 3, 13, '#8b5e3c'], [11, 2, 3, 13, '#8b5e3c'],
    [3, 2, 3, 1, '#a9713f'], [11, 2, 3, 1, '#a9713f']
  ])];
}

/* ============================================================================
 *  MOTOR — cámara, colisiones, movimiento por casillas y render
 * ==========================================================================*/

const ANCHO_MAPA = MAPA[0].length;
const ALTO_MAPA = MAPA.length;

const DIRS = [
  { dx: 0, dy: 1 },   // 0 abajo
  { dx: -1, dy: 0 },  // 1 izquierda
  { dx: 1, dy: 0 },   // 2 derecha
  { dx: 0, dy: -1 }   // 3 arriba
];

const MOV_MS = 185;   // duración de un paso
const GIRO_MS = 75;   // pausa al girar sin moverse

let cv, ctx, vpW = 0, vpH = 0, dpr = 1;
let hojaSprite = null;              // sprite sheet de la jugadora
const FRAME_W = 24, FRAME_H = 32;   // tamaño de cada frame del sheet
const PIES = 30;                    // y donde terminan los pies dentro del frame
const ESC_JUG = 3;                  // escala del sprite (3 = mismo tamaño de píxel que el escenario)

const cam = { x: 0, y: 0 };
const solido = [];                  // grilla de colisión
const objPorTile = new Map();       // "x,y" -> objeto

const jugadora = {
  tx: INICIO.x, ty: INICIO.y,
  px: INICIO.x * TILE, py: INICIO.y * TILE,
  dir: INICIO.dir,
  moviendo: false, t: 0, desdeX: 0, desdeY: 0,
  paso: 0, giro: 0
};

const bicho = { px: 0, py: 0, dir: 0, visible: false, cola: [] };

const input = { dir: -1, a: false, aEdge: false };

/* --- construcción del mundo --------------------------------------------- */
function construirMundo() {
  for (let y = 0; y < ALTO_MAPA; y++) {
    solido[y] = [];
    for (let x = 0; x < ANCHO_MAPA; x++) {
      solido[y][x] = SOLIDOS.has(MAPA[y][x]);
    }
  }
  for (const o of OBJETOS) {
    const art = ART_OBJ[o.art];
    o.tw = art.tw; o.th = art.th;
    o.decor = o.decor || art.decor;
    o.pared = o.pared || art.pared;   // colgado en la pared: no ocupa lugar, ya era sólida
    for (let j = 0; j < art.th; j++) {
      for (let i = 0; i < art.tw; i++) {
        const k = (o.x + i) + ',' + (o.y + j);
        objPorTile.set(k, o);
        if (!o.decor && !o.pared) solido[o.y + j][o.x + i] = true;
      }
    }
  }
}

function tilePasable(x, y) {
  if (x < 0 || y < 0 || x >= ANCHO_MAPA || y >= ALTO_MAPA) return false;
  return !solido[y][x];
}

function objetoFrente() {
  const d = DIRS[jugadora.dir];
  const o = objPorTile.get((jugadora.tx + d.dx) + ',' + (jugadora.ty + d.dy));
  return (o && o.accion) ? o : null;
}

/* --- canvas -------------------------------------------------------------- */
function ajustarCanvas() {
  const cont = document.getElementById('escena');
  const r = cont.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vpW = Math.round(r.width); vpH = Math.round(r.height);
  cv.width = Math.round(vpW * dpr);
  cv.height = Math.round(vpH * dpr);
  cv.style.width = vpW + 'px';
  cv.style.height = vpH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

function actualizarCamara(inmediato) {
  const mundoW = ANCHO_MAPA * TILE, mundoH = ALTO_MAPA * TILE;
  let cx = jugadora.px + TILE / 2 - vpW / 2;
  let cy = jugadora.py + TILE / 2 - vpH / 2;
  cx = mundoW <= vpW ? (mundoW - vpW) / 2 : Math.max(0, Math.min(mundoW - vpW, cx));
  cy = mundoH <= vpH ? (mundoH - vpH) / 2 : Math.max(0, Math.min(mundoH - vpH, cy));
  if (inmediato) { cam.x = cx; cam.y = cy; }
  else { cam.x += (cx - cam.x) * 0.18; cam.y += (cy - cam.y) * 0.18; }
}

/* --- movimiento ---------------------------------------------------------- */
function actualizarJugadora(dt) {
  if (jugadora.moviendo) {
    jugadora.t += dt;
    const p = Math.min(1, jugadora.t / MOV_MS);
    jugadora.px = jugadora.desdeX + (jugadora.tx * TILE - jugadora.desdeX) * p;
    jugadora.py = jugadora.desdeY + (jugadora.ty * TILE - jugadora.desdeY) * p;
    if (p >= 1) {
      jugadora.moviendo = false;
      jugadora.paso ^= 1;
      registrarCola();
    }
    return;
  }
  if (jugadora.giro > 0) { jugadora.giro -= dt; return; }
  if (!juegoActivo()) return;

  const d = input.dir;
  if (d < 0) return;
  if (jugadora.dir !== d) {
    jugadora.dir = d;
    jugadora.giro = GIRO_MS;
    return;
  }
  const dd = DIRS[d];
  const nx = jugadora.tx + dd.dx, ny = jugadora.ty + dd.dy;
  if (!tilePasable(nx, ny)) { sonar('bloqueo'); return; }
  jugadora.desdeX = jugadora.px; jugadora.desdeY = jugadora.py;
  jugadora.tx = nx; jugadora.ty = ny;
  jugadora.t = 0; jugadora.moviendo = true;
}

/* el compañero sigue el rastro de la jugadora */
function registrarCola() {
  bicho.cola.push({ x: jugadora.tx * TILE, y: jugadora.ty * TILE });
  if (bicho.cola.length > 3) bicho.cola.shift();
}

function actualizarBicho() {
  if (!bicho.visible || bicho.cola.length < 3) return;
  const dest = bicho.cola[0];
  bicho.px += (dest.x - bicho.px) * 0.16;
  bicho.py += (dest.y - bicho.py) * 0.16;
}

/* --- render -------------------------------------------------------------- */
let tiempoAnim = 0;

function dibujar(dt) {
  tiempoAnim += dt;
  ctx.fillStyle = '#1b1b2a';
  ctx.fillRect(0, 0, vpW, vpH);

  const x0 = Math.max(0, Math.floor(cam.x / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE));
  const x1 = Math.min(ANCHO_MAPA - 1, Math.ceil((cam.x + vpW) / TILE));
  const y1 = Math.min(ALTO_MAPA - 1, Math.ceil((cam.y + vpH) / TILE));
  const fAgua = Math.floor(tiempoAnim / 550) % 2;

  // suelo
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const c = MAPA[y][x];
      let set = TILES[c] || TILES.G;
      let img;
      if (c === '~') img = set[fAgua];
      // la pared usa el remate sólo cuando no tiene otra pared encima
      else if (c === '#') img = (y > 0 && MAPA[y - 1][x] === '#') ? set[1] : set[0];
      else img = set.length > 1 ? set[(x * 7 + y * 13) % set.length] : set[0];
      ctx.drawImage(img, 0, 0, TILE_SRC, TILE_SRC,
        Math.round(x * TILE - cam.x), Math.round(y * TILE - cam.y), TILE, TILE);
    }
  }

  // sombra bajo paredes (da profundidad)
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (MAPA[y][x] === '#' && y + 1 < ALTO_MAPA && MAPA[y + 1][x] !== '#') {
        ctx.fillRect(Math.round(x * TILE - cam.x), Math.round((y + 1) * TILE - cam.y), TILE, 7);
      }
    }
  }

  // las cosas planas (alfombras, flores) son parte del piso: van antes que todo,
  // si no una alfombra grande termina tapando a la jugadora
  for (const o of OBJETOS) {
    if (!o.decor) continue;
    if (o.x + o.tw < x0 - 1 || o.x > x1 + 1 || o.y + o.th < y0 - 1 || o.y > y1 + 1) continue;
    dibujarObjeto(o);
  }

  // el resto se ordena por su base para que la jugadora pase por delante o por detrás
  const lista = [];
  for (const o of OBJETOS) {
    if (o.decor) continue;
    if (o.x + o.tw < x0 - 1 || o.x > x1 + 1 || o.y + o.th < y0 - 1 || o.y > y1 + 1) continue;
    lista.push({ tipo: 'obj', o, base: (o.y + o.th) * TILE });
  }
  lista.push({ tipo: 'jug', base: (jugadora.py + TILE) });
  if (bicho.visible) lista.push({ tipo: 'bicho', base: bicho.py + TILE - 1 });
  lista.sort((a, b) => a.base - b.base);

  for (const it of lista) {
    if (it.tipo === 'obj') dibujarObjeto(it.o);
    else if (it.tipo === 'jug') dibujarJugadora();
    else dibujarBicho();
  }

  aplicarLuzAmbiente();
}

function dibujarObjeto(o) {
  const img = SPR[o.art];
  const dx = Math.round(o.x * TILE - cam.x);
  const dy = Math.round(o.y * TILE - cam.y);
  const w = o.tw * TILE, h = o.th * TILE;
  if (!o.decor && !o.pared) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(dx + w / 2, dy + h - 5, w * 0.36, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.drawImage(img, dx, dy, w, h);
  if (o.art === 'tvpared') dibujarPantallaTele(dx, dy);

  // burbuja de estado sobre las misiones
  if (o.accion === 'mision') {
    const m = misionPorId(o.mision);
    const hecho = hechoHoy(o.mision) >= m.veces;
    const flot = Math.sin(tiempoAnim / 320) * 3;
    ctx.drawImage(hecho ? SPR.__check : SPR.__alerta,
      Math.round(dx + w / 2 - 12), Math.round(dy - 26 + flot), 24, 24);
  } else if (o.accion && o.accion !== 'info') {
    const pend = (o.accion === 'animo' && hechoHoy('animo') === 0) ||
      (o.accion === 'carta' && !EST.cartaVista) ||
      (o.accion === 'companero' && puedeEclosionar());
    if (pend) {
      const flot = Math.sin(tiempoAnim / 320) * 3;
      ctx.drawImage(SPR.__alerta, Math.round(dx + w / 2 - 12), Math.round(dy - 26 + flot), 24, 24);
    }
  }
}

/* --- la tele de verdad reproduce el gif ---------------------------------- */
/* La tira tiene los cuadros uno al lado del otro; se dibuja adentro del marco. */
const TELE = { w: 39, h: 30, cuadros: 19, ms: 50 };
const PANTALLA_TELE = { x: 3, y: 6, w: 26, h: 20 };   // en píxeles del arte (x3 en pantalla)
let hojaTele = null;

function dibujarPantallaTele(dx, dy) {
  const px = dx + PANTALLA_TELE.x * S;
  const py = dy + PANTALLA_TELE.y * S;
  const pw = PANTALLA_TELE.w * S, ph = PANTALLA_TELE.h * S;

  if (!hojaTele) {
    ctx.fillStyle = '#1a1a28';
    ctx.fillRect(px, py, pw, ph);
    return;
  }
  const f = Math.floor(tiempoAnim / TELE.ms) % TELE.cuadros;
  ctx.drawImage(hojaTele, f * TELE.w, 0, TELE.w, TELE.h, px, py, pw, ph);

  // brillo del vidrio, para que se lea como pantalla y no como un póster
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(px + pw * 0.45, py);
  ctx.lineTo(px, py + ph * 0.75); ctx.closePath();
  ctx.fill();
}

function dibujarJugadora() {
  const w = FRAME_W * ESC_JUG, h = FRAME_H * ESC_JUG;
  const dx = Math.round(jugadora.px - cam.x + TILE / 2 - w / 2);
  const dy = Math.round(jugadora.py - cam.y + TILE - PIES * ESC_JUG - 3);

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(Math.round(jugadora.px - cam.x + TILE / 2), Math.round(jugadora.py - cam.y + TILE - 5),
    15, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  let f = 0;
  if (jugadora.moviendo) {
    const p = jugadora.t / MOV_MS;
    f = p < 0.5 ? (jugadora.paso ? 3 : 1) : (jugadora.paso ? 2 : 0);
  }
  if (hojaSprite) {
    ctx.drawImage(hojaSprite, f * FRAME_W, jugadora.dir * FRAME_H, FRAME_W, FRAME_H, dx, dy, w, h);
  } else {
    ctx.fillStyle = '#f06292';
    ctx.fillRect(dx + 12, dy + 20, 26, 34);
  }
}

function dibujarBicho() {
  const et = etapaBicho();
  if (et < 0) return;
  const img = SPR.__bichos[et];
  const flot = Math.sin(tiempoAnim / 260) * 2;
  const dx = Math.round(bicho.px - cam.x + TILE / 2 - TILE * 0.38);
  const dy = Math.round(bicho.py - cam.y + TILE - TILE * 0.72 + flot);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(dx + TILE * 0.38, dy + TILE * 0.72, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.drawImage(img, dx, dy, TILE * 0.76, TILE * 0.76);
}

/* luz según la hora real: mañana cálida, tarde neutra, noche azulada */
function aplicarLuzAmbiente() {
  const h = new Date().getHours();
  let col = null;
  if (h >= 21 || h < 6) col = 'rgba(30,40,90,0.34)';
  else if (h >= 19) col = 'rgba(255,140,80,0.16)';
  else if (h < 8) col = 'rgba(255,200,120,0.12)';
  if (!col) return;
  ctx.fillStyle = col;
  ctx.fillRect(0, 0, vpW, vpH);
}

/* ============================================================================
 *  SONIDO — pequeños bips sintetizados (sin archivos externos)
 * ==========================================================================*/
let audioCtx = null;
function iniciarAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function tono(freq, dur, tipo, vol) {
  if (!audioCtx || !EST.sonido) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = tipo || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function sonar(tipo) {
  if (!EST.sonido) return;
  switch (tipo) {
    case 'texto': tono(760, 0.03, 'square', 0.018); break;
    case 'ok': tono(660, 0.08); setTimeout(() => tono(880, 0.1), 70); break;
    case 'menu': tono(520, 0.05, 'triangle', 0.04); break;
    case 'bloqueo': tono(140, 0.05, 'square', 0.025); break;
    case 'moneda': tono(1050, 0.06); setTimeout(() => tono(1400, 0.08), 60); break;
    case 'nivel':
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tono(f, 0.16, 'triangle', 0.06), i * 110));
      break;
    case 'eclosion':
      [392, 523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tono(f, 0.2, 'triangle', 0.06), i * 130));
      break;
  }
}


/* ============================================================================
 *  LÓGICA DEL JUEGO — progreso, guardado, misiones, racha, compañero
 * ==========================================================================*/

const CLAVE_GUARDADO = 'rutina_legendaria_v1';

const EST_INICIAL = () => ({
  v: 1,
  dia: null,
  nivel: 1,
  xp: 0,
  oro: 0,
  racha: 0,
  mejorRacha: 0,
  diasCompletos: 0,
  totalMisiones: 0,
  hoy: {},
  animoHoy: null,
  historial: [],          // [{d:'2026-08-14', animo:'bien', hechas:6}]
  cartaVista: false,
  cartaIdx: -1,
  eclosionado: false,
  bichoNombre: null,
  canjeados: [],          // [{id, fecha}]
  sonido: true,
  primeraVez: true
});

let EST = EST_INICIAL();
let modo = 'titulo';   // titulo | juego | dialogo | menu

function juegoActivo() { return modo === 'juego'; }

/* --- fecha lógica del juego (el día arranca a las 4 AM) ------------------ */
function diaDeJuego(f) {
  const d = new Date(f || Date.now());
  if (d.getHours() < CONFIG.horaReinicio) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fechaBonita(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return `${d}/${m}/${a}`;
}

function diasEntre(isoA, isoB) {
  const a = new Date(isoA + 'T12:00:00'), b = new Date(isoB + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}

/* --- guardado ------------------------------------------------------------ */
function guardar() {
  try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(EST)); } catch (e) { }
}

function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE_GUARDADO);
    if (raw) EST = Object.assign(EST_INICIAL(), JSON.parse(raw));
  } catch (e) { EST = EST_INICIAL(); }
}

/* --- cambio de día ------------------------------------------------------- */
function chequearDia() {
  const hoy = diaDeJuego();
  if (EST.dia === hoy) return false;

  if (EST.dia) {
    const hechas = contarHechasHoy();
    EST.historial.push({ d: EST.dia, animo: EST.animoHoy, hechas });
    if (EST.historial.length > 90) EST.historial.shift();

    const cumplio = hechas >= CONFIG.misionesParaRacha;
    const consecutivo = diasEntre(EST.dia, hoy) === 1;
    if (cumplio && consecutivo) EST.racha++;
    else if (cumplio) EST.racha = 1;
    else EST.racha = 0;
    if (EST.racha > EST.mejorRacha) EST.mejorRacha = EST.racha;
    if (hechas >= MISIONES.length) EST.diasCompletos++;
  }

  EST.dia = hoy;
  EST.hoy = {};
  EST.animoHoy = null;
  EST.cartaVista = false;
  EST.cartaIdx = Math.floor(Math.random() * CARTAS.length);
  guardar();
  return true;
}

/* --- misiones ------------------------------------------------------------ */
function misionPorId(id) { return MISIONES.find(m => m.id === id); }
function hechoHoy(id) { return EST.hoy[id] || 0; }

function contarHechasHoy() {
  let n = 0;
  for (const m of MISIONES) if (hechoHoy(m.id) >= m.veces) n++;
  return n;
}

function progresoDelDia() {
  let hechas = 0, total = 0;
  for (const m of MISIONES) { hechas += Math.min(hechoHoy(m.id), m.veces); total += m.veces; }
  return { hechas, total, pct: Math.round(hechas / total * 100) };
}

function completarMision(id) {
  const m = misionPorId(id);
  const antes = hechoHoy(id);
  if (antes >= m.veces) return null;
  EST.hoy[id] = antes + 1;
  EST.totalMisiones++;
  const completa = EST.hoy[id] >= m.veces;
  const subio = darXP(m.xp);
  EST.oro += m.oro;
  guardar();
  return {
    xp: m.xp, oro: m.oro, completa, subio,
    texto: completa ? m.final : m.frase[Math.min(antes, m.frase.length - 1)],
    resta: m.veces - EST.hoy[id]
  };
}

/* --- nivel --------------------------------------------------------------- */
function xpNecesaria(nivel) { return 80 + (nivel - 1) * 55; }

function darXP(n) {
  EST.xp += n;
  let subio = 0;
  while (EST.xp >= xpNecesaria(EST.nivel)) {
    EST.xp -= xpNecesaria(EST.nivel);
    EST.nivel++;
    subio++;
  }
  return subio;
}

/* --- compañero ----------------------------------------------------------- */
function etapaBicho() {
  if (!EST.eclosionado) return -1;
  let et = 0;
  COMPANERO.etapas.forEach((e, i) => { if (EST.nivel >= e.desde) et = i; });
  return et;
}

function puedeEclosionar() {
  return !EST.eclosionado && EST.nivel >= COMPANERO.nivelEclosion;
}

function nombreBicho() {
  const et = etapaBicho();
  if (et < 0) return 'Huevo';
  return EST.bichoNombre || COMPANERO.etapas[et].nombre;
}

/* --- premios ------------------------------------------------------------- */
function canjear(id) {
  const p = PREMIOS.find(x => x.id === id);
  if (!p || EST.oro < p.costo) return false;
  EST.oro -= p.costo;
  EST.canjeados.unshift({ id, fecha: diaDeJuego() });
  guardar();
  return true;
}

/* ============================================================================
 *  INTERACCIONES CON LOS OBJETOS
 * ==========================================================================*/
function interactuar(o) {
  switch (o.accion) {
    case 'mision': accionMision(o.mision); break;
    case 'animo': accionAnimo(); break;
    case 'carta': accionCarta(); break;
    case 'premios': abrirMenu('premios'); break;
    case 'progreso': accionNotebook(); break;
    case 'tele': accionTele(); break;
    case 'companero': accionCompanero(); break;
    case 'info': accionCartel(); break;
  }
}

/* La notebook del cuarto: abre el panel de progreso */
function accionNotebook() {
  const p = progresoDelDia();
  dialogo([{
    t: `💻 Tu notebook\nLa pantalla muestra todos tus números.\n\nHoy: ${p.hechas}/${p.total} · Nivel ${EST.nivel} · Racha ${EST.racha} 🔥`,
    opciones: [
      { txt: 'Ver el progreso', cb: () => abrirMenu('progreso') },
      { txt: 'Cerrarla', cb: () => { } }
    ]
  }]);
}

/* La tele del cuarto: el resumen del día en tono de noticiero */
function accionTele() {
  const p = progresoDelDia();
  const hechas = contarHechasHoy();
  let nota;
  if (p.hechas === 0) {
    nota = `"Todavía no hay novedades desde la casa de ${CONFIG.jugadora}. Los analistas coinciden: el día recién arranca y no hay apuro."`;
  } else if (p.hechas === p.total) {
    nota = `"¡ÚLTIMO MOMENTO! ${CONFIG.jugadora} completó las ${MISIONES.length} misiones del día. El país entero está impactado. ${CONFIG.autor} no puede parar de sonreír."`;
  } else if (hechas >= CONFIG.misionesParaRacha) {
    nota = `"${CONFIG.jugadora} lleva ${hechas} misiones completas y la racha asegurada. Fuentes cercanas hablan de una persona imparable."`;
  } else {
    nota = `"${CONFIG.jugadora} avanza con ${p.hechas} de ${p.total} tareas del día. Los expertos recomiendan seguir sin exigirse de más."`;
  }
  const cola = [
    { t: '📺 Están dando Hello Kitty.\nLos dos gatitos se dan un beso. Siempre el mismo, en loop, sin cansarse nunca.\n\nTe queda mirándolo un rato.' },
    { t: `📺 Cambiás de canal. Están dando las noticias.\n\n${nota}` }
  ];
  if (EST.racha > 0) {
    cola.push({ t: `📺 "En deportes: ${EST.racha} ${EST.racha === 1 ? 'día' : 'días'} seguidos de racha. Un récord que sigue creciendo."` });
  }
  cola.push({ t: 'Volvés a poner Hello Kitty. Obvio.' });
  dialogo(cola);
}

function accionMision(id) {
  const m = misionPorId(id);
  const hechas = hechoHoy(id);
  if (hechas >= m.veces) {
    dialogo([{ t: `${m.icono}  ${m.nombre}\nYa lo hiciste hoy (${m.veces}/${m.veces}). Descansá, campeona.` }]);
    return;
  }
  const restante = m.veces > 1 ? `  (${hechas}/${m.veces} hoy)` : '';
  dialogo([{
    t: `${m.icono}  ${m.nombre}${restante}\n¿Lo hiciste?`,
    opciones: [
      { txt: 'Sí, ya está', cb: () => confirmarMision(id) },
      { txt: 'Todavía no', cb: () => dialogo([{ t: 'Cuando puedas. No hay apuro, no hay culpa.' }]) }
    ]
  }]);
}

function confirmarMision(id) {
  const r = completarMision(id);
  if (!r) return;
  sonar('ok');
  efectoRecompensa(r.xp, r.oro);
  const cola = [{ t: r.texto, premio: `+${r.xp} XP   +${r.oro} 🪙` }];
  if (!r.completa && r.resta > 0) {
    cola.push({ t: `Te quedan ${r.resta} para completar esta misión hoy.` });
  }
  if (r.subio) {
    for (let i = 0; i < r.subio; i++) cola.push({ t: `¡SUBISTE AL NIVEL ${EST.nivel - r.subio + i + 1}!\n${fraseNivel(EST.nivel - r.subio + i + 1)}`, fanfarria: true });
  }
  const p = progresoDelDia();
  if (p.hechas === p.total) {
    cola.push({ t: `¡DÍA COMPLETO!\nHiciste todo lo del día. Estoy muy orgulloso de vos, ${CONFIG.jugadora}. Te merecés todo lo lindo.`, fanfarria: true });
  } else if (contarHechasHoy() === CONFIG.misionesParaRacha) {
    cola.push({ t: `Racha asegurada por hoy 🔥\nLlevás ${EST.racha + 1} ${EST.racha + 1 === 1 ? 'día' : 'días'} seguidos cuidándote.` });
  }
  if (puedeEclosionar()) {
    cola.push({ t: '¡El huevo del jardín se está moviendo!\nAndá a verlo.' });
  }
  dialogo(cola);
}

function fraseNivel(n) {
  const f = [
    'Cada día que te cuidás, subís un poquito.',
    'Mirá lo que lográs cuando te das lugar.',
    'Nivel nuevo, misma persona increíble.',
    'Esto no es suerte. Es constancia tuya.',
    'Te dije que podías.'
  ];
  return f[n % f.length];
}

function accionAnimo() {
  if (EST.animoHoy) {
    const a = ANIMOS.find(x => x.id === EST.animoHoy);
    dialogo([{ t: `📔 Diario\nHoy anotaste que estabas: ${a.cara} ${a.label}.\n\n${a.resp}` }]);
    return;
  }
  dialogo([{
    t: '📔 Diario\n¿Cómo venís hoy? Contame la verdad, no la versión educada.',
    opciones: ANIMOS.map(a => ({
      txt: `${a.cara} ${a.label}`,
      cb: () => {
        EST.animoHoy = a.id;
        const r = completarMision('animo');
        sonar('ok');
        if (r) efectoRecompensa(r.xp, r.oro);
        guardar();
        const cola = [{ t: a.resp, premio: r ? `+${r.xp} XP   +${r.oro} 🪙` : null }];
        if (r && r.subio) cola.push({ t: `¡SUBISTE AL NIVEL ${EST.nivel}!`, fanfarria: true });
        dialogo(cola);
      }
    }))
  }]);
}

function accionCarta() {
  if (EST.cartaIdx < 0) EST.cartaIdx = Math.floor(Math.random() * CARTAS.length);
  EST.cartaVista = true;
  guardar();
  dialogo([{ t: `💌 Nota de ${CONFIG.autor}\n\n"${CARTAS[EST.cartaIdx]}"`, carta: true }]);
}

function accionCartel() {
  dialogo([
    { t: `🪧 "Casa de ${CONFIG.jugadora}"\nCada cosa de la casa es una misión del día. Acercate y tocá A.` },
    { t: 'Las misiones dan XP y monedas. Las monedas se cambian por premios reales en el puesto del living.' },
    { t: `Si hacés ${CONFIG.misionesParaRacha} misiones en el día, mantenés la racha 🔥` }
  ]);
}

function accionCompanero() {
  if (puedeEclosionar()) {
    EST.eclosionado = true;
    bicho.visible = true;
    bicho.px = jugadora.px; bicho.py = jugadora.py;
    guardar();
    sonar('eclosion');
    efectoFlash();
    dialogo([
      { t: '¡El huevo se está rompiendo!', fanfarria: true },
      { t: `¡Nació ${COMPANERO.etapas[0].nombre}!\n${COMPANERO.etapas[0].desc}` },
      { t: 'Va a crecer con vos: cada nivel tuyo también es suyo.' }
    ]);
    return;
  }
  if (!EST.eclosionado) {
    const faltan = COMPANERO.nivelEclosion - EST.nivel;
    dialogo([{ t: `🥚 Un huevo tibio.\nParece que necesita más energía para nacer.\n\nLe faltan ${faltan} ${faltan === 1 ? 'nivel' : 'niveles'} tuyos.` }]);
    return;
  }
  const et = etapaBicho();
  const e = COMPANERO.etapas[et];
  const sig = COMPANERO.etapas[et + 1];
  const cola = [{ t: `${nombreBicho()} (etapa ${et + 1})\n${e.desc}` }];
  if (sig) cola.push({ t: `Va a evolucionar cuando llegues al nivel ${sig.desde}. Te faltan ${sig.desde - EST.nivel}.` });
  else cola.push({ t: 'Llegó a su forma final. Eso lo hiciste vos, día por día.' });
  dialogo(cola);
}


/* ============================================================================
 *  INTERFAZ — HUD, diálogos estilo Pokémon, menú y controles táctiles
 * ==========================================================================*/

const $ = id => document.getElementById(id);

/* --- HUD ----------------------------------------------------------------- */
function actualizarHUD() {
  const nec = xpNecesaria(EST.nivel);
  $('hudNivel').textContent = EST.nivel;
  $('hudXP').style.width = Math.min(100, EST.xp / nec * 100) + '%';
  $('hudXPTxt').textContent = EST.xp + '/' + nec;
  $('hudOro').textContent = EST.oro;
  $('hudRacha').textContent = EST.racha;
  const p = progresoDelDia();
  $('hudDia').textContent = p.hechas + '/' + p.total;
  $('hudDiaBarra').style.width = p.pct + '%';
}

/* --- efectos ------------------------------------------------------------- */
function efectoRecompensa(xp, oro) {
  const cont = $('efectos');
  const el = document.createElement('div');
  el.className = 'flotante';
  el.textContent = `+${xp} XP  +${oro}🪙`;
  cont.appendChild(el);
  setTimeout(() => el.remove(), 1400);
  actualizarHUD();
}

function efectoFlash() {
  const f = $('flash');
  f.classList.remove('activo');
  void f.offsetWidth;
  f.classList.add('activo');
}

/* --- diálogos ------------------------------------------------------------ */
let cola = [], actual = null, escribiendo = false, textoCompleto = '', idxLetra = 0, tmrTexto = null;
let modoAnterior = 'juego';

function dialogo(items) {
  cola = items.slice();
  if (modo !== 'dialogo') modoAnterior = modo;
  modo = 'dialogo';
  $('dialogo').classList.add('visible');
  siguienteDialogo();
}

function siguienteDialogo() {
  if (cola.length === 0) { cerrarDialogo(); return; }
  actual = cola.shift();
  const caja = $('dialogo');
  caja.classList.toggle('carta', !!actual.carta);
  caja.classList.toggle('fanfarria', !!actual.fanfarria);
  if (actual.fanfarria) { sonar('nivel'); efectoFlash(); }
  $('dlgPremio').textContent = actual.premio || '';
  $('dlgPremio').style.display = actual.premio ? 'block' : 'none';
  $('dlgOpciones').innerHTML = '';
  $('dlgOpciones').classList.remove('visible');
  $('dlgFlecha').classList.remove('visible');
  textoCompleto = actual.t;
  idxLetra = 0;
  escribiendo = true;
  $('dlgTexto').textContent = '';
  clearInterval(tmrTexto);
  tmrTexto = setInterval(tecleo, 18);
}

function tecleo() {
  if (idxLetra >= textoCompleto.length) { terminarTexto(); return; }
  const paso = 2;
  const trozo = textoCompleto.slice(idxLetra, idxLetra + paso);
  $('dlgTexto').textContent += trozo;
  idxLetra += paso;
  if (idxLetra % 6 < paso && trozo.trim()) sonar('texto');
}

function terminarTexto() {
  clearInterval(tmrTexto);
  escribiendo = false;
  $('dlgTexto').textContent = textoCompleto;
  if (actual.opciones) {
    const box = $('dlgOpciones');
    box.innerHTML = '';
    actual.opciones.forEach((op, i) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.dataset.i = i;
      b.innerHTML = `<span class="numOp">${i + 1}</span>${op.txt}`;
      b.onclick = (e) => { e.stopPropagation(); elegirOpcion(i); };
      b.onmouseenter = () => marcarOpcion(i);
      box.appendChild(b);
    });
    box.classList.add('visible');

function moverOpcion(paso) {

function hayOpciones() {

function avanzarDialogo() {
  if (modo !== 'dialogo') return;
  if (escribiendo) { idxLetra = textoCompleto.length; terminarTexto(); return; }

  siguienteDialogo();

function cerrarDialogo(silencioso) {
  clearInterval(tmrTexto);

/* ---------------------------------------------------------------------------
 *  PROGRESO — lo que muestra la notebook del cuarto
 *
 *  La tira de días mide "cuántas misiones completaste" (una magnitud a lo
 *  largo del tiempo), así que va como barritas: la altura ya dice el número.
 *  El color es un solo tono que va de claro a oscuro acompañando esa altura,
 *  nunca colores distintos por día — el dato no cambia de categoría, cambia
 *  de cantidad. Así también se entiende sin distinguir bien los colores.
 * -------------------------------------------------------------------------*/
const DIAS_TIRA = 14;
const RAMPA = ['#e8ded0', '#f7dc94', '#f2c14e', '#e0a020', '#c9821a'];

function colorDia(n, total) {
  if (!n) return RAMPA[0];
  const p = n / total;
  if (p >= 1) return RAMPA[4];
  if (p >= 0.66) return RAMPA[3];
  if (p >= 0.33) return RAMPA[2];
  return RAMPA[1];
}

function ultimosDias() {
  const total = MISIONES.length;
  const porFecha = {};
  for (const h of EST.historial) porFecha[h.d] = h;
  porFecha[EST.dia] = { d: EST.dia, animo: EST.animoHoy, hechas: contarHechasHoy() };

  const hoy = new Date(EST.dia + 'T12:00:00');
  const out = [];
  for (let i = DIAS_TIRA - 1; i >= 0; i--) {
    const f = new Date(hoy); f.setDate(f.getDate() - i);
    const iso = f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
    const reg = porFecha[iso];
    out.push({ iso, hechas: reg ? reg.hechas : 0, animo: reg ? reg.animo : null, hayDato: !!reg, total });
  }
  return out;
}

function htmlProgreso() {
  const dias = ultimosDias();
  const total = MISIONES.length;
  const nec = xpNecesaria(EST.nivel);
  const maxD = Math.max(...dias.map(d => d.hechas));
  const conDato = dias.filter(d => d.hayDato);
  const prom = conDato.length ? (conDato.reduce((s, d) => s + d.hechas, 0) / conDato.length) : 0;

  const barras = dias.map((d, i) => {
    const alt = d.hechas ? Math.max(8, Math.round(d.hechas / total * 100)) : 4;
    const esHoy = d.iso === EST.dia;
    const etiqueta = (d.hechas === maxD && maxD > 0 && !dias.slice(0, i).some(x => x.hechas === maxD)) || esHoy;
    return `<div class="colDia${esHoy ? ' hoy' : ''}" title="${fechaBonita(d.iso)} · ${d.hechas} de ${total}">
        <span class="valDia">${etiqueta && d.hechas ? d.hechas : ''}</span>
        <div class="barDia" style="height:${alt}%;background:${colorDia(d.hechas, total)}"></div>
      </div>`;
  }).join('');

  const animos = {};
  for (const d of dias) if (d.animo) animos[d.animo] = (animos[d.animo] || 0) + 1;
  const listaAnimo = ANIMOS.filter(a => animos[a.id])
    .map(a => `<span class="chipAnimo">${a.cara} ${a.label} <b>${animos[a.id]}</b></span>`).join('');

  return `<div class="panel centro">
      <div class="heroNum">${EST.racha}<small>🔥</small></div>
      <div class="heroTxt">${EST.racha === 1 ? 'día' : 'días'} de racha</div>
      <div class="sub">Tu mejor marca: ${EST.mejorRacha} ${EST.mejorRacha === 1 ? 'día' : 'días'}</div>
    </div>

    <div class="panel">
      <div class="panelTitulo">Últimos ${DIAS_TIRA} días</div>
      <div class="sub">Misiones completas por día (de ${total})</div>
      <div class="tira">${barras}</div>
      <div class="tiraPie">
        <span>${fechaBonita(dias[0].iso)}</span>
        <span class="escala">menos ${RAMPA.slice(1).map(c => `<i style="background:${c}"></i>`).join('')} más</span>
        <span>hoy</span>
      </div>
      <div class="sub">Promedio de los días jugados: <b>${prom.toFixed(1)}</b> de ${total}</div>
    </div>

    <div class="panel">
      <div class="panelTitulo">Tus números</div>
      <div class="cuadricula">
        <div class="celda"><b>${EST.nivel}</b><span>nivel</span></div>
        <div class="celda"><b>${EST.xp}/${nec}</b><span>XP</span></div>
        <div class="celda"><b>${EST.oro}</b><span>monedas</span></div>
        <div class="celda"><b>${EST.totalMisiones}</b><span>misiones hechas</span></div>
        <div class="celda"><b>${EST.diasCompletos}</b><span>días perfectos</span></div>
        <div class="celda"><b>${EST.canjeados.length}</b><span>premios canjeados</span></div>
      </div>
    </div>

    ${listaAnimo ? `<div class="panel">
      <div class="panelTitulo">Cómo te sentiste</div>
      <div class="sub">En los últimos ${DIAS_TIRA} días</div>
      <div class="chips">${listaAnimo}</div>
    </div>` : ''}`;
}

}

function pulsarB() {
  iniciarAudio();
  if (modo === 'dialogo') { cerrarDialogo(); return; }
  if (modo === 'menu') { cerrarMenu(); return; }
  if (modo === 'juego') abrirMenu('misiones');

function armarControles() {
  const mapa = { arriba: 3, abajo: 0, izq: 1, der: 2 };
  for (const k in mapa) {
    const el = $('d' + k);
    const on = e => { e.preventDefault(); iniciarAudio(); input.dir = mapa[k]; el.classList.add('presionado'); };
    const off = e => { e.preventDefault(); if (input.dir === mapa[k]) input.dir = -1; el.classList.remove('presionado'); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }
  const botA = $('botA'), botB = $('botB');
  botA.addEventListener('touchstart', e => { e.preventDefault(); pulsarA(); }, { passive: false });
  botA.addEventListener('click', e => { e.preventDefault(); pulsarA(); });
  botB.addEventListener('touchstart', e => { e.preventDefault(); pulsarB(); }, { passive: false });
  botB.addEventListener('click', e => { e.preventDefault(); pulsarB(); });

  $('dialogo').addEventListener('click', () => { if (!actual || !actual.opciones) avanzarDialogo(); });
  $('btnMenu').onclick = () => { iniciarAudio(); modo === 'menu' ? cerrarMenu() : abrirMenu('misiones'); };
  $('btnCerrarMenu').onclick = cerrarMenu;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    pestana = t.dataset.p; sonar('menu'); renderMenu();
    if (pestana === 'compa') setTimeout(pintarBichoMenu, 0);
  });

  armarTeclado();
  addEventListener('resize', () => { ajustarCanvas(); actualizarCamara(true); });
  addEventListener('blur', soltarTodo);
}

/* ---------------------------------------------------------------------------
 *  TECLADO (para jugar en la computadora)
 *
 *  Moverse ....... flechas  o  W A S D
 *  Botón A ....... Z  ·  Espacio  ·  Enter      (aceptar / hablar)
 *  Botón B ....... X  ·  Esc  ·  Backspace      (volver / cerrar)
 *  Menú .......... M  ·  Tab
 *  Opciones ...... flechas para elegir, o las teclas 1-5 directo
 *
 *  Z y X son las de siempre en los emuladores de Game Boy: quedan al lado
 *  de las flechas si usás las dos manos, y no chocan con W A S D.
 * -------------------------------------------------------------------------*/
const TECLAS_DIR = {
  ArrowUp: 3, ArrowDown: 0, ArrowLeft: 1, ArrowRight: 2,
  KeyW: 3, KeyS: 0, KeyA: 1, KeyD: 2
};
const TECLAS_A = ['KeyZ', 'Space', 'Enter', 'NumpadEnter'];
const TECLAS_B = ['KeyX', 'Escape', 'Backspace'];
const TECLAS_MENU = ['KeyM', 'Tab'];
const IDS_DPAD = { 0: 'dabajo', 1: 'dizq', 2: 'dder', 3: 'darriba' };

const pilaDir = [];   // direcciones apretadas, la última manda

function pintarDpad() {
  for (const d in IDS_DPAD) $(IDS_DPAD[d]).classList.toggle('presionado', input.dir === +d);
}

function soltarTodo() {
  pilaDir.length = 0;
  input.dir = -1;
  pintarDpad();
}

function armarTeclado() {
  addEventListener('keydown', e => {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;

    const d = TECLAS_DIR[e.code];
    if (d !== undefined) {
      e.preventDefault();
      if (e.repeat) return;
      // durante un diálogo con opciones, las flechas eligen
      if (hayOpciones() && (d === 0 || d === 3)) { moverOpcion(d === 0 ? 1 : -1); return; }
      if (!pilaDir.includes(d)) pilaDir.push(d);
      input.dir = d;
      pintarDpad();
      return;
    }

    // elegir opción con 1-5
    if (hayOpciones() && /^(Digit|Numpad)[1-5]$/.test(e.code)) {
      e.preventDefault();
      elegirOpcion(parseInt(e.code.slice(-1), 10) - 1);
      return;
    }

    if (TECLAS_A.includes(e.code)) {
      e.preventDefault();
      if (e.repeat) return;           // sin esto, dejar apretada la tecla se come los diálogos
      $('botA').classList.add('presionado');
      pulsarA();
      return;
    }
    if (TECLAS_B.includes(e.code)) {
      e.preventDefault();
      if (e.repeat) return;
      $('botB').classList.add('presionado');
      pulsarB();
      return;
    }
    if (TECLAS_MENU.includes(e.code)) {
      e.preventDefault();
      if (e.repeat) return;
      if (modo === 'menu') cerrarMenu();
      else if (modo === 'juego') { iniciarAudio(); abrirMenu('misiones'); }
    }
  });

  addEventListener('keyup', e => {
    const d = TECLAS_DIR[e.code];
    if (d !== undefined) {
      const i = pilaDir.indexOf(d);
      if (i >= 0) pilaDir.splice(i, 1);
      input.dir = pilaDir.length ? pilaDir[pilaDir.length - 1] : -1;
      pintarDpad();
    }
    if (TECLAS_A.includes(e.code)) $('botA').classList.remove('presionado');
    if (TECLAS_B.includes(e.code)) $('botB').classList.remove('presionado');
  });
}

function pintarBichoMenu() {
  const c = $('lienzoBicho');
  if (!c) return;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 96, 96);
  const et = etapaBicho();
  if (et >= 0) g.drawImage(SPR.__bichos[et], 0, 0, 96, 96);
  const inp = $('inpNombre'), btn = $('btnNombre');
  if (btn) btn.onclick = () => {
    EST.bichoNombre = inp.value.trim().slice(0, 12) || null;
    guardar(); sonar('ok'); renderMenu(); setTimeout(pintarBichoMenu, 0);
  };
}

/* ============================================================================
 *  ARRANQUE
 * ==========================================================================*/

/* Sprite de Kath: hoja de 4 columnas x 4 filas (abajo, izq, der, arriba),

function cargarImagen(src) {
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => ok(null);
    img.src = src;
  });
}

function cargarSprite(listo) {
  Promise.all([cargarImagen(SPRITE_JUGADORA), cargarImagen(VIDEO_TELE)])
    .then(([sp, tv]) => { hojaSprite = sp; hojaTele = tv; listo(); });
}

let ultimo = 0;
function bucle(ts) {
  const dt = Math.min(50, ts - ultimo || 16);
  ultimo = ts;
  actualizarJugadora(dt);
  actualizarBicho();
  actualizarCamara(false);
  dibujar(dt);
  requestAnimationFrame(bucle);
}

function iniciar() {
  cv = $('lienzo');
  ctx = cv.getContext('2d');

  construirTiles();
  construirObjetos();
  construirMundo();

  cargar();
  chequearDia();
  if (EST.cartaIdx < 0) EST.cartaIdx = Math.floor(Math.random() * CARTAS.length);

  jugadora.px = jugadora.tx * TILE;
  jugadora.py = jugadora.ty * TILE;
  registrarCola(); registrarCola(); registrarCola();
  if (EST.eclosionado) {
    bicho.visible = true;
    bicho.px = jugadora.px; bicho.py = jugadora.py;
  }

  ajustarCanvas();
  actualizarCamara(true);
  actualizarHUD();
  armarControles();

  $('tituloNombre').textContent = CONFIG.jugadora;
  $('tituloPie').textContent = EST.primeraVez
    ? `un regalo de ${CONFIG.autor}`
    : `nivel ${EST.nivel} · racha de ${EST.racha} ${EST.racha === 1 ? 'día' : 'días'}`;

  cargarSprite(() => {
    $('cargando').style.display = 'none';
    requestAnimationFrame(bucle);
  });

  // si el teléfono estuvo dormido y cambió el día, refrescamos
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && chequearDia()) {
      actualizarHUD();
      dialogo([{ t: `Día nuevo, ${CONFIG.jugadora}.\nLas misiones se reiniciaron. ${EST.racha > 0 ? `Racha: ${EST.racha} 🔥` : ''}` }]);
    }
  });

  // evita el scroll y el zoom con dos dedos
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', iniciar);
else iniciar();

</script>
<script>
// corazones decorativos de la portada
(function(){
  const c=document.getElementById('corazones');
  for(let i=0;i<14;i++){
    const h=document.createElement('i');
    h.textContent=['💗','💛','✨','💙'][i%4];
    h.style.left=(Math.random()*100)+'%';
    h.style.animationDuration=(7+Math.random()*8)+'s';
    h.style.animationDelay=(-Math.random()*12)+'s';
    h.style.fontSize=(12+Math.random()*14)+'px';
    c.appendChild(h);
  }
  document.getElementById('tituloTocar').addEventListener('click',function(){ empezar(); });
})();
</script>
