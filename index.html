<!-- La portada del link: esto es lo que se ve cuando alguien manda la
     dirección por WhatsApp, y es lo primero que vio Kath del juego.

     Las URLs van ABSOLUTAS y no relativas a propósito. El resto del sitio usa
     rutas relativas (vite base:'./') para poder servirse desde cualquier
     carpeta, pero el que arma la vista previa no es el navegador: es un robot
     de WhatsApp que lee el HTML suelto y no tiene contra qué resolver un
     "./portada.jpg". Con ruta relativa la mayoría de los clientes no muestran
     imagen. Si algún día cambia el dominio, hay que cambiarlas acá. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rutina Legendaria">
<meta property="og:locale" content="es_AR">
<meta property="og:url" content="https://rutina-legendaria.pages.dev/">
